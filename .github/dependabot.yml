version: 2
updates:
  # Go dependencies
  - package-ecosystem: "gomod"
    directory: "/entrypoint"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "chore"
    target-branch: main
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    target-branch: main
